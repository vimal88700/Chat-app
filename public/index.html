<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Chat & Call</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #e5ddd5; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Login Screen */
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: white; z-index: 200; }
        #setup input { width: 80%; padding: 15px; margin: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        #setup button { width: 85%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 10px; font-weight: bold; }

        /* Main App Structure */
        #chat-area { display: none; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: auto; background: #fff; }
        
        #header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        
        /* Video Area Fix */
        #video-panel { display: none; background: #000; position: relative; height: 40%; min-height: 250px; width: 100%; border-bottom: 2px solid #075e54; }
        #video-grid { display: grid; grid-template-columns: 1fr 1fr; height: 100%; width: 100%; gap: 2px; }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; transform: scaleX(-1); }
        
        /* Call Toolbar */
        #call-controls { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 12px; z-index: 100; }
        .ctrl-btn { width: 45px; height: 45px; border-radius: 50%; border: none; color: white; background: rgba(0,0,0,0.7); font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .hangup { background: #ea4335 !important; }

        /* Chat History - Auto Scroll Fix */
        #messages { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; }
        .msg { max-width: 75%; padding: 8px 12px; margin-bottom: 8px; border-radius: 10px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .my-msg { align-self: flex-end; background: #dcf8c6; }
        .others-msg { align-self: flex-start; background: #fff; }
        .system-msg { align-self: center; background: #d1e3f3; font-size: 10px; padding: 4px 10px; border-radius: 5px; margin: 10px 0; }

        /* Input Bar - Keyboard Fix */
        #input-area { padding: 10px; background: #f0f0f0; display: flex; align-items: center; border-top: 1px solid #ddd; padding-bottom: env(safe-area-inset-bottom); }
        #msgInput { flex: 1; border: none; padding: 12px; border-radius: 25px; outline: none; font-size: 16px; margin-right: 10px; }
        #sendBtn { background: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body>

<div id="setup">
    <h2 style="color:#075e54">Secure Chat</h2>
    <input type="text" id="code" placeholder="6-Digit Code" maxlength="6">
    <input type="text" id="name" placeholder="Your Name">
    <button onclick="enterApp()">ENTER</button>
</div>

<div id="chat-area">
    <div id="header">
        <b id="roomTitle">Room</b>
        <div>
            <button onclick="startCall(false)" style="background:none; border:none; font-size:22px; color:white; margin-right:15px;">📞</button>
            <button onclick="startCall(true)" style="background:none; border:none; font-size:22px; color:white;">📹</button>
        </div>
    </div>

    <div id="video-panel">
        <div id="video-grid"></div>
        <div id="call-controls">
            <button id="micBtn" class="ctrl-btn" onclick="toggleMic()">🎤</button>
            <button id="camBtn" class="ctrl-btn" onclick="toggleCam()">📷</button>
            <button class="ctrl-btn" onclick="flipCamera()">🔄</button>
            <button class="ctrl-btn hangup" onclick="endCall()">❌</button>
        </div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Message...">
        <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
</div>

<script>
    const socket = io();
    const myPeer = new Peer();
    
    let myStream, currentRoom, myName, currentCall;
    let micOn = true, camOn = true, isFront = true;
    let isAlreadyCalling = false;

    // 1. LOGIN
    function enterApp() {
        const c = document.getElementById('code').value;
        const n = document.getElementById('name').value;
        if(c.length === 6 && n !== "") {
            currentRoom = c; myName = n;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('roomTitle').innerText = "Room: " + c;
            socket.emit('joinRoom', { roomCode: c, username: n });
        } else { alert("Enter 6 digits and a name"); }
    }

    // 2. CALLING LOGIC
    async function startCall(videoOn) {
        if(isAlreadyCalling) return;
        try {
            isAlreadyCalling = true;
            myStream = await navigator.mediaDevices.getUserMedia({
                video: videoOn ? { facingMode: "user" } : false,
                audio: true
            });
            openCallUI();
            addStream(myStream, true);
            socket.emit('call-request', { peerId: myPeer.id, video: videoOn, name: myName });
        } catch (e) { 
            alert("Camera/Mic denied"); 
            isAlreadyCalling = false;
        }
    }

    socket.on('incoming-call', (data) => {
        if(isAlreadyCalling) return; // Ignore if busy
        if (confirm(`Incoming ${data.video ? 'Video' : 'Voice'} call from ${data.name}. Accept?`)) {
            isAlreadyCalling = true;
            navigator.mediaDevices.getUserMedia({ video: data.video, audio: true }).then(stream => {
                myStream = stream;
                openCallUI();
                addStream(stream, true);
                const call = myPeer.call(data.peerId, stream);
                handleCall(call);
            });
        }
    });

    myPeer.on('call', call => {
        if(!myStream) return;
        call.answer(myStream);
        handleCall(call);
    });

    function handleCall(call) {
        currentCall = call;
        call.on('stream', remoteStream => addStream(remoteStream, false));
        call.on('close', () => endCall());
    }

    function openCallUI() {
        document.getElementById('video-panel').style.display = 'block';
    }

    function addStream(stream, isMe) {
        const grid = document.getElementById('video-grid');
        const id = isMe ? 'local-video' : 'remote-video';
        if (document.getElementById(id)) document.getElementById(id).remove();
        
        const v = document.createElement('video');
        v.id = id;
        v.srcObject = stream;
        v.autoplay = true;
        v.playsInline = true;
        grid.append(v);
    }

    // 3. CONTROLS (Bug 6 Fix)
    function toggleMic() {
        micOn = !micOn;
        myStream.getAudioTracks()[0].enabled = micOn;
        document.getElementById('micBtn').innerText = micOn ? '🎤' : '🔇';
    }

    function toggleCam() {
        if (!myStream.getVideoTracks()[0]) return;
        camOn = !camOn;
        myStream.getVideoTracks()[0].enabled = camOn;
        document.getElementById('camBtn').innerText = camOn ? '📷' : '🚫';
    }

    async function flipCamera() {
        if (!myStream.getVideoTracks()[0]) return;
        isFront = !isFront;
        const newStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: isFront ? "user" : "environment" }, audio: true
        });
        const videoTrack = newStream.getVideoTracks()[0];
        if (currentCall) {
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
        }
        myStream.removeTrack(myStream.getVideoTracks()[0]);
        myStream.addTrack(videoTrack);
        addStream(myStream, true);
    }

    function endCall() {
        if (myStream) {
            myStream.getTracks().forEach(t => t.stop());
            myStream = null;
        }
        if (currentCall) currentCall.close();
        document.getElementById('video-panel').style.display = 'none';
        document.getElementById('video-grid').innerHTML = '';
        isAlreadyCalling = false;
        // IMPORTANT: No page reload here!
    }

    // 4. MESSAGING (Bug 4/5 Fix)
    function sendMsg() {
        const val = document.getElementById('msgInput').value;
        if(val.trim()) {
            socket.emit('sendMessage', { roomCode: currentRoom, message: val, username: myName });
            document.getElementById('msgInput').value = "";
        }
    }

    socket.on('newMessage', (m) => render(m));
    socket.on('previousMessages', (arr) => {
        document.getElementById('messages').innerHTML = '';
        arr.forEach(render);
    });
    socket.on('systemMessage', (txt) => {
        const d = document.createElement('div'); d.className = 'system-msg'; d.innerText = txt;
        document.getElementById('messages').appendChild(d);
        scrollDown();
    });

    function render(m) {
        const d = document.createElement('div');
        const isMe = m.username === myName;
        d.className = `msg ${isMe ? 'my-msg' : 'others-msg'}`;
        const body = m.content || m.message;
        d.innerHTML = `<b style="font-size:10px;display:block;color:#075e54">${isMe ? 'You' : m.username}</b>${body}`;
        document.getElementById('messages').appendChild(d);
        scrollDown();
    }

    function scrollDown() {
        const m = document.getElementById('messages');
        m.scrollTop = m.scrollHeight;
    }

    // Fix for Keyboard pushing UI
    window.addEventListener('resize', scrollDown);
</script>
</body>
</html>
