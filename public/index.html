<!DOCTYPE html>
<html>
<head>
    <title>Pro Chat & Call</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <style>
        body { font-family: sans-serif; background-color: #e5ddd5; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #debug-log { font-size: 10px; color: #777; padding: 5px; background: #fff; border-bottom: 1px solid #ddd; }
        #setup { background: white; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #setup input { width: 80%; padding: 15px; margin: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        #setup button { width: 85%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; }
        #chat-area { display: none; flex-direction: column; height: 100vh; background: white; }
        #header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #video-panel { display: none; background: #000; height: 250px; position: relative; }
        #video-grid { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; }
        .msg { background: white; padding: 10px; margin-bottom: 8px; border-radius: 8px; max-width: 80%; }
        .my-msg { align-self: flex-end; background: #dcf8c6; }
        #input-area { padding: 10px; display: flex; background: #f0f0f0; border-top: 1px solid #ddd; }
        #msgInput { flex: 1; padding: 12px; border: none; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="debug-log">System: Ready (V4)</div>

    <!-- LOGIN SCREEN -->
    <div id="setup">
        <h2 style="color:#075e54">Secure Chat</h2>
        <input type="text" id="code" placeholder="6-Digit Code" maxlength="6">
        <input type="text" id="name" placeholder="Your Nickname">
        <button id="mainBtn" onclick="enterChat()">ENTER CHAT</button>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-area">
        <div id="header">
            <b id="roomLabel">Room</b>
            <div id="call-tools" style="display:none;">
                <button onclick="startCall(false)" style="background:none; border:none; font-size:20px; color:white;">📞</button>
                <button onclick="startCall(true)" style="background:none; border:none; font-size:20px; color:white; margin-left:10px;">📹</button>
            </div>
        </div>
        <div id="video-panel">
            <div id="video-grid"></div>
            <div style="position:absolute; bottom:10px; width:100%; text-align:center;">
                <button onclick="location.reload()" style="background:#ea4335; color:white; border:none; padding:10px; border-radius:5px;">End Call</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msgInput" placeholder="Message...">
            <button onclick="sendMsg()" style="background:#075e54; color:white; border:none; border-radius:50%; width:40px; height:40px; margin-left:5px;">➤</button>
        </div>
    </div>

    <!-- LOAD LIBRARIES LAST SO THEY DON'T BLOCK THE BUTTON -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // Check if Socket.io loaded
        setTimeout(() => {
            if (typeof io !== 'undefined') {
                document.getElementById('debug-log').innerText = "System: Fully Connected";
                document.getElementById('call-tools').style.display = 'block';
            } else {
                document.getElementById('debug-log').innerText = "System: Offline Mode (Server issue)";
            }
        }, 2000);

        let socket = (typeof io !== 'undefined') ? io() : null;
        let myPeer = (typeof Peer !== 'undefined') ? new Peer() : null;
        let myStream, currentRoom, myName, currentCall;

        function enterChat() {
            const c = document.getElementById('code').value;
            const n = document.getElementById('name').value;
            
            if(c.length === 6 && n !== "") {
                currentRoom = c;
                myName = n;
                
                // SWITCH UI IMMEDIATELY
                document.getElementById('setup').style.display = 'none';
                document.getElementById('chat-area').style.display = 'flex';
                document.getElementById('roomLabel').innerText = "Room: " + c;

                // TRY CONNECTING
                if(socket) {
                    socket.emit('joinRoom', { roomCode: c, username: n });
                }
            } else {
                alert("Enter 6 digits and a name");
            }
        }

        function sendMsg() {
            const val = document.getElementById('msgInput').value;
            if(val && socket) {
                socket.emit('sendMessage', { roomCode: currentRoom, message: val, username: myName });
                document.getElementById('msgInput').value = "";
            }
        }

        if(socket) {
            socket.on('newMessage', m => render(m));
            socket.on('previousMessages', arr => arr.forEach(render));
            socket.on('systemMessage', t => {
                const d = document.createElement('div');
                d.style = "text-align:center; font-size:10px; color:#555; margin:10px;";
                d.innerText = t;
                document.getElementById('messages').appendChild(d);
            });
        }

        function render(m) {
            const d = document.createElement('div');
            const isMe = m.username === myName;
            d.className = 'msg ' + (isMe ? 'my-msg' : '');
            const txt = m.content || m.message;
            d.innerHTML = `<b>${m.username}:</b><br>${txt}`;
            document.getElementById('messages').appendChild(d);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        // --- SIMPLE CALL LOGIC ---
        async function startCall(video) {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
                document.getElementById('video-panel').style.display = 'block';
                addVid(myStream, true);
                socket.emit('call-request', { peerId: myPeer.id, video: video, name: myName });
            } catch(e) { alert("Camera Error"); }
        }

        if(myPeer) {
            myPeer.on('call', call => {
                call.answer(myStream);
                call.on('stream', remote => addVid(remote, false));
            });
        }

        function addVid(s, isMe) {
            const v = document.createElement('video');
            v.srcObject = s;
            v.autoplay = true;
            v.playsInline = true;
            v.style = "width:100%; height:100%; object-fit:cover;";
            document.getElementById('video-grid').append(v);
        }
    </script>
</body>
</html>
