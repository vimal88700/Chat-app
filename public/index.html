<!DOCTYPE html>
<html>
<head>
    <title>Pro Chat & Call</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: white; padding: 20px; }
        #chat-area { display: none; flex-direction: column; height: 100vh; width: 100%; max-width: 600px; margin: auto; background: #fff; }
        
        #header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Video Container */
        #video-container { display: none; position: relative; background: #000; height: 250px; }
        #video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; }

        /* Call Controls Overlay */
        #call-controls { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 15px; z-index: 10; }
        .control-btn { width: 40px; height: 40px; border-radius: 50%; border: none; color: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .btn-red { background: #ea4335; }
        .btn-dark { background: rgba(0,0,0,0.6); }

        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background: #efe7dd; }
        .msg { max-width: 75%; padding: 8px 12px; margin-bottom: 8px; border-radius: 10px; font-size: 14px; position: relative; }
        .my-msg { align-self: flex-end; background: #dcf8c6; }
        .others-msg { align-self: flex-start; background: #fff; }
        .system-msg { align-self: center; background: #d1e3f3; color: #444; font-size: 10px; border-radius: 4px; margin: 10px 0; padding: 3px 8px; }

        #input-area { padding: 10px; background: #f0f0f0; display: flex; align-items: center; }
        #msgInput { flex: 1; border: none; padding: 12px; border-radius: 25px; outline: none; margin-right: 10px; }
        .action-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 0 5px; }
    </style>
</head>
<body>

<div id="setup">
    <h2 style="color:#075e54">Secure Chat & Call</h2>
    <input type="text" id="code" placeholder="6-Digit Code" maxlength="6" style="padding:12px; margin:8px; width:220px; border:1px solid #ddd; border-radius:8px;">
    <input type="text" id="name" placeholder="Nickname" style="padding:12px; margin:8px; width:220px; border:1px solid #ddd; border-radius:8px;">
    <button onclick="startApp()" style="padding:12px 50px; background:#25d366; color:white; border:none; border-radius:8px; font-weight:bold; margin-top:10px;">ENTER</button>
</div>

<div id="chat-area">
    <div id="header">
        <span id="roomName">Room</span>
        <div>
            <button class="action-btn" onclick="initiateCall(false)">📞</button>
            <button class="action-btn" onclick="initiateCall(true)">📹</button>
        </div>
    </div>

    <div id="video-container">
        <div id="video-grid"></div>
        <div id="call-controls">
            <button id="muteBtn" class="control-btn btn-dark" onclick="toggleMic()">🎤</button>
            <button id="camBtn" class="control-btn btn-dark" onclick="toggleCam()">📷</button>
            <button class="control-btn btn-dark" onclick="switchCamera()">🔄</button>
            <button class="control-btn btn-red" onclick="endCall()">❌</button>
        </div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Message...">
        <button onclick="sendMsg()" style="background:#075e54; color:white; border:none; border-radius:50%; width:40px; height:40px;">➤</button>
    </div>
</div>
