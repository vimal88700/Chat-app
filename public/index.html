<!DOCTYPE html>
<html>
<head>
    <title>Chat App Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <style>
        /* CSS stays simple to prevent layout crashes */
        body { font-family: sans-serif; background-color: #e5ddd5; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        #debug-log { font-size: 10px; color: #777; padding: 5px; background: #fff; border-bottom: 1px solid #ddd; }
        
        #setup { background: white; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
        #setup input { width: 80%; padding: 15px; margin: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        #setup button { width: 85%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; }

        #chat-area { display: none; flex-direction: column; height: 100vh; background: white; }
        #header { background: #075e54; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        #video-panel { display: none; background: #000; height: 250px; position: relative; }
        #video-grid { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; }
        
        #call-controls { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 10px; }
        .ctrl-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: white; }

        #messages { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; }
        .msg { background: white; padding: 10px; margin-bottom: 8px; border-radius: 8px; max-width: 80%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg { align-self: flex-end; background: #dcf8c6; }
        .system-msg { align-self: center; background: #d1e3f3; font-size: 10px; padding: 4px 8px; border-radius: 4px; margin: 10px 0; }

        #input-area { padding: 10px; display: flex; background: #f0f0f0; border-top: 1px solid #ddd; }
        #msgInput { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; }
    </style>
</head>
<body>

    <div id="debug-log">System: Loading...</div>

    <!-- LOGIN SCREEN -->
    <div id="setup">
        <h2 style="color:#075e54">Secure Chat</h2>
        <input type="text" id="code" placeholder="6-Digit Code" maxlength="6">
        <input type="text" id="name" placeholder="Your Nickname">
        <button onclick="enterChat()">ENTER CHAT</button>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-area">
        <div id="header">
            <b id="roomLabel">Room</b>
            <div>
                <button onclick="startCall(false)" style="background:none; border:none; font-size:20px; color:white; margin-right:10px;">📞</button>
                <button onclick="startCall(true)" style="background:none; border:none; font-size:20px; color:white;">📹</button>
            </div>
        </div>

        <div id="video-panel">
            <div id="video-grid"></div>
            <div id="call-controls">
                <button onclick="toggleMic()" class="ctrl-btn">🎤</button>
                <button onclick="toggleCam()" class="ctrl-btn">📷</button>
                <button onclick="flipCam()" class="ctrl-btn">🔄</button>
                <button onclick="location.reload()" class="ctrl-btn" style="background:#ea4335">❌</button>
            </div>
        </div>

        <div id="messages"></div>

        <div id="input-area">
            <input type="text" id="msgInput" placeholder="Message...">
            <button onclick="sendMsg()" style="background:#075e54; color:white; border:none; border-radius:50%; width:40px; height:40px; margin-left:5px;">➤</button>
        </div>
    </div>

    <!-- SCRIPTS AT THE BOTTOM -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        document.getElementById('debug-log').innerText = "System: Ready";

        const socket = io();
        let myPeer;
        try { myPeer = new Peer(); } catch(e) { document.getElementById('debug-log').innerText = "System: PeerJS Error"; }

        let myStream, currentRoom, myName, currentCall;
        let micOn = true, camOn = true, front = true;

        function enterChat() {
            const c = document.getElementById('code').value;
            const n = document.getElementById('name').value;
            if(c.length === 6 && n !== "") {
                currentRoom = c; myName = n;
                document.getElementById('setup').style.display = 'none';
                document.getElementById('chat-area').style.display = 'flex';
                document.getElementById('roomLabel').innerText = "Room: " + c;
                socket.emit('joinRoom', { roomCode: c, username: n });
            } else {
                alert("Enter 6-digit code and name");
            }
        }

        async function startCall(video) {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: video ? {facingMode: "user"} : false, audio: true });
                document.getElementById('video-panel').style.display = 'block';
                addVid(myStream, true);
                socket.emit('call-request', { peerId: myPeer.id, video: video, name: myName });
            } catch(e) { alert("Camera denied"); }
        }

        socket.on('incoming-call', (data) => {
            if(confirm("Call from " + data.name + ". Answer?")) {
                navigator.mediaDevices.getUserMedia({ video: data.video, audio: true }).then(s => {
                    myStream = s;
                    document.getElementById('video-panel').style.display = 'block';
                    addVid(s, true);
                    const call = myPeer.call(data.peerId, s);
                    currentCall = call;
                    call.on('stream', remote => addVid(remote, false));
                });
            }
        });

        if(myPeer) {
            myPeer.on('call', call => {
                call.answer(myStream);
                currentCall = call;
                call.on('stream', remote => addVid(remote, false));
            });
        }

        function addVid(s, isMe) {
            const grid = document.getElementById('video-grid');
            if(isMe && document.getElementById('me')) document.getElementById('me').remove();
            const v = document.createElement('video');
            if(isMe) v.id = 'me';
            v.srcObject = s;
            v.autoplay = true;
            v.playsInline = true;
            grid.append(v);
        }

        function toggleMic() {
            micOn = !micOn;
            myStream.getAudioTracks()[0].enabled = micOn;
        }

        function toggleCam() {
            if(myStream.getVideoTracks()[0]) {
                camOn = !camOn;
                myStream.getVideoTracks()[0].enabled = camOn;
            }
        }

        async function flipCam() {
            front = !front;
            const s = await navigator.mediaDevices.getUserMedia({ video: {facingMode: front ? "user" : "environment"}, audio: true });
            const track = s.getVideoTracks()[0];
            if(currentCall) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                sender.replaceTrack(track);
            }
            myStream.removeTrack(myStream.getVideoTracks()[0]);
            myStream.addTrack(track);
            addVid(myStream, true);
        }

        function sendMsg() {
            const val = document.getElementById('msgInput').value;
            if(val) {
                socket.emit('sendMessage', { roomCode: currentRoom, message: val, username: myName });
                document.getElementById('msgInput').value = "";
            }
        }

        socket.on('newMessage', m => render(m));
        socket.on('previousMessages', arr => arr.forEach(render));
        socket.on('systemMessage', t => {
            const d = document.createElement('div'); d.className = 'system-msg'; d.innerText = t;
            document.getElementById('messages').appendChild(d);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });

        function render(m) {
            const d = document.createElement('div');
            const isMe = m.username === myName;
            d.className = 'msg ' + (isMe ? 'my-msg' : '');
            const txt = m.content || m.message;
            d.innerHTML = `<small style="display:block;color:#075e54;font-weight:bold">${isMe ? 'You' : m.username}</small>${txt}`;
