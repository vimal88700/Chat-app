<!DOCTYPE html>
<html>
<head>
    <title>Chat Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            overflow: hidden; background-color: #e5ddd5;
            position: fixed; width: 100%; /* Prevents rubber-banding */
        }

        /* Entrance Screen */
        #setup { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100%; background: white; position: absolute; width: 100%; z-index: 1000; 
        }
        #setup input { width: 80%; padding: 15px; margin: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        #setup button { width: 80%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; }

        /* Main Layout */
        #app-container { display: none; flex-direction: column; height: 100%; width: 100%; background: #efe7dd; }
        
        #header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; height: 60px; flex-shrink: 0; }
        
        /* Video Fix - Only 2 slots */
        #video-area { display: none; background: #000; height: 220px; width: 100%; position: relative; flex-shrink: 0; }
        #video-grid { display: grid; grid-template-columns: 1fr 1fr; height: 100%; width: 100%; gap: 2px; }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; transform: scaleX(-1); }
        
        /* Call Controls Overlay */
        #call-ui { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 50; }
        .ui-btn { width: 40px; height: 40px; border-radius: 50%; border: none; color: white; background: rgba(0,0,0,0.6); font-size: 18px; display: flex; align-items: center; justify-content: center; }

        /* Chat History - Telegram Style */
        #messages { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; 
            -webkit-overflow-scrolling: touch;
        }
        .msg { max-width: 80%; padding: 8px 12px; margin-bottom: 8px; border-radius: 10px; font-size: 15px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; line-height: 1.4; }
        .my-msg { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 2px; }
        .others-msg { align-self: flex-start; background: #fff; border-top-left-radius: 2px; }
        .system { align-self: center; background: #d1e3f3; color: #444; font-size: 11px; padding: 4px 10px; border-radius: 5px; margin: 10px 0; }

        /* Input Bar - Fixed at bottom */
        #input-wrapper { background: #f0f0f0; padding: 8px 10px; display: flex; align-items: center; border-top: 1px solid #ddd; flex-shrink: 0; }
        #msgInput { flex: 1; border: none; padding: 12px 15px; border-radius: 25px; outline: none; font-size: 16px; background: white; }
        #sendBtn { background: #075e54; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; margin-left: 8px; font-size: 20px; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="setup">
    <h2 style="color:#075e54">Secure Chat</h2>
    <input type="text" id="code" placeholder="6-Digit Code" maxlength="6" inputmode="numeric">
    <input type="text" id="name" placeholder="Nickname">
    <button onclick="enterApp()">ENTER</button>
</div>

<div id="app-container">
    <div id="header">
        <b id="roomName">Room</b>
        <div>
            <button onclick="startCall(false)" style="background:none; border:none; font-size:22px; color:white; margin-right:15px;">📞</button>
            <button onclick="startCall(true)" style="background:none; border:none; font-size:22px; color:white;">📹</button>
        </div>
    </div>

    <div id="video-area">
        <div id="video-grid">
            <video id="local-v" autoplay playsinline muted></video>
            <video id="remote-v" autoplay playsinline></video>
        </div>
        <div id="call-ui">
            <button id="micBtn" class="ui-btn" onclick="toggleMic()">🎤</button>
            <button id="camBtn" class="ui-btn" onclick="toggleCam()">📷</button>
            <button class="ui-btn" onclick="flipCam()">🔄</button>
            <button class="ui-btn" style="background:#ea4335" onclick="endCall()">❌</button>
        </div>
    </div>

    <div id="messages"></div>

    <div id="input-wrapper">
        <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
        <button id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
</div>

<script>
    const socket = io();
    const myPeer = new Peer();
    
    let myStream, currentRoom, myName, currentCall;
    let isMicOn = true, isCamOn = true, isFront = true;
    let callInProgress = false;

    // 1. ENTER APP
    function enterApp() {
        const c = document.getElementById('code').value;
        const n = document.getElementById('name').value;
        if(c.length === 6 && n !== "") {
            currentRoom = c; myName = n;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('roomName').innerText = "Room: " + c;
            socket.emit('joinRoom', { roomCode: c, username: n });
            setTimeout(scrollDown, 500);
        } else { alert("Enter 6 digits and a name"); }
    }

    // 2. CALL LOGIC (Fixing Duplication & Video)
    async function startCall(video) {
        if(callInProgress) return;
        try {
            callInProgress = true;
            myStream = await navigator.mediaDevices.getUserMedia({
                video: video ? { facingMode: "user" } : false,
                audio: true
            });
            document.getElementById('video-area').style.display = 'block';
            document.getElementById('local-v').srcObject = myStream;
            socket.emit('call-request', { peerId: myPeer.id, video: video, name: myName });
        } catch (e) { alert("Camera Denied"); callInProgress = false; }
    }

    socket.on('incoming-call', (data) => {
        if(callInProgress) return;
        if(confirm(`Call from ${data.name}. Accept?`)) {
            callInProgress = true;
            navigator.mediaDevices.getUserMedia({ video: data.video, audio: true }).then(stream => {
                myStream = stream;
                document.getElementById('video-area').style.display = 'block';
                document.getElementById('local-v').srcObject = myStream;
                const call = myPeer.call(data.peerId, stream);
                setupCall(call);
            });
        }
    });

    myPeer.on('call', call => {
        if(!myStream) return;
        call.answer(myStream);
        setupCall(call);
    });

    function setupCall(call) {
        currentCall = call;
        call.on('stream', remoteStream => {
            document.getElementById('remote-v').srcObject = remoteStream;
        });
        call.on('close', endCall);
    }

    function toggleMic() {
        isMicOn = !isMicOn;
        myStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('micBtn').innerText = isMicOn ? '🎤' : '🔇';
    }

    function toggleCam() {
        if(myStream.getVideoTracks()[0]) {
            isCamOn = !isCamOn;
            myStream.getVideoTracks()[0].enabled = isCamOn;
            document.getElementById('camBtn').innerText = isCamOn ? '📷' : '🚫';
        }
    }

    async function flipCam() {
        if(!myStream.getVideoTracks()[0]) return;
        isFront = !isFront;
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: isFront ? "user" : "environment" }, audio: true
        });
        const videoTrack = stream.getVideoTracks()[0];
        if(currentCall) {
            const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
        }
        myStream.removeTrack(myStream.getVideoTracks()[0]);
        myStream.addTrack(videoTrack);
        document.getElementById('local-v').srcObject = myStream;
    }

    function endCall() {
        if(myStream) myStream.getTracks().forEach(t => t.stop());
        document.getElementById('video-area').style.display = 'none';
        document.getElementById('local-v').srcObject = null;
        document.getElementById('remote-v').srcObject = null;
        callInProgress = false;
    }

    // 3. MESSAGING (Fixing Keyboard & Scrolling)
    function sendMsg() {
        const input = document.getElementById('msgInput');
        const val = input.value;
        if(val.trim()) {
            socket.emit('sendMessage', { roomCode: currentRoom, message: val, username: myName });
            input.value = "";
            input.focus(); // Keep keyboard open
        }
    }

    socket.on('newMessage', m => render(m));
    socket.on('previousMessages', arr => {
        document.getElementById('messages').innerHTML = '';
        arr.forEach(render);
        setTimeout(scrollDown, 200);
    });

    socket.on('systemMessage', t => {
        const d = document.createElement('div'); d.className = 'system'; d.innerText = t;
        document.getElementById('messages').appendChild(d);
        scrollDown();
    });

    function render(m) {
        const d = document.createElement('div');
        const isMe = m.username === myName;
        d.className = `msg ${isMe ? 'my-msg' : 'others-msg'}`;
        const txt = m.content || m.message;
        d.innerHTML = `<small style="display:block;color:#075e54;font-weight:bold">${isMe ? 'You' : m.username}</small>${txt}`;
        document.getElementById('messages').appendChild(d);
        scrollDown();
    }

    function scrollDown() {
        const m = document.getElementById('messages');
        m.scrollTop = m.scrollHeight;
    }

    // Fix for Keyboard resize behavior
    window.visualViewport.addEventListener('resize', () => {
        document.body.style.height = window.visualViewport.height + 'px';
        scrollDown();
    });

    // Enter key to send
    document.getElementById('msgInput').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') sendMsg();
    });
</script>
</body>
</html>
