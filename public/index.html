<!DOCTYPE html>
<html>
<head>
    <title>Private Chat & Call</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: white; padding: 20px; }
        #chat-area { display: none; flex-direction: column; height: 100vh; max-width: 600px; margin: auto; width: 100%; background: #fff; }
        #header { background: #075e54; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        #video-grid { display: none; grid-template-columns: 1fr 1fr; gap: 5px; background: #000; padding: 5px; }
        video { width: 100%; border-radius: 8px; background: #222; transform: scaleX(-1); }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; background: #efe7dd; }
        .msg { max-width: 75%; padding: 8px 12px; margin-bottom: 8px; border-radius: 10px; font-size: 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 0; }
        .others-msg { align-self: flex-start; background: #fff; border-top-left-radius: 0; }
        .system-msg { align-self: center; background: #d1e3f3; color: #444; font-size: 10px; border-radius: 4px; margin: 10px 0; padding: 3px 8px; }
        .user-label { font-weight: bold; font-size: 11px; color: #075e54; display: block; margin-bottom: 2px; }
        #input-area { padding: 10px; background: #f0f0f0; display: flex; align-items: center; }
        #msgInput { flex: 1; border: none; padding: 12px; border-radius: 25px; outline: none; margin-right: 10px; }
        .circle-btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body>

<div id="setup">
    <h2 style="color:#075e54">Private 6-Digit Chat</h2>
    <input type="text" id="code" placeholder="6-Digit Code" maxlength="6" style="padding:12px; margin:8px; width:220px; border:1px solid #ddd; border-radius:8px;">
    <input type="text" id="name" placeholder="Your Nickname" style="padding:12px; margin:8px; width:220px; border:1px solid #ddd; border-radius:8px;">
    <button onclick="start()" style="padding:12px 50px; background:#25d366; color:white; border:none; border-radius:8px; font-weight:bold; margin-top:10px;">JOIN CHAT</button>
</div>

<div id="chat-area">
    <div id="header">
        <span id="roomDisplay">Room: ------</span>
        <button onclick="startCall()" class="circle-btn" style="background:#25d366; color:white;">📞</button>
    </div>
    <div id="video-grid"></div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Type a message...">
        <button onclick="send()" class="circle-btn" style="background:#075e54; color:white;">➤</button>
    </div>
</div>

<script>
    const socket = io();
    const myPeer = new Peer();
    let currentRoom, myName, myStream;

    function start() {
        currentRoom = document.getElementById('code').value;
        myName = document.getElementById('name').value;
        if(currentRoom.length === 6 && myName) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('roomDisplay').innerText = "Room: " + currentRoom;
            socket.emit('joinRoom', { roomCode: currentRoom, username: myName });
        }
    }

    // --- VIDEO CALL LOGIC ---
    function startCall() {
        navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream => {
            myStream = stream;
            document.getElementById('video-grid').style.display = 'grid';
            addVideo(stream);
            socket.emit('call-user', myPeer.id);
        }).catch(e => alert("Please enable camera access"));
    }

    socket.on('incoming-call-id', (remotePeerId) => {
        if(confirm("Incoming Video Call! Answer?")) {
            navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream => {
                myStream = stream;
                document.getElementById('video-grid').style.display = 'grid';
                addVideo(stream);
                const call = myPeer.call(remotePeerId, stream);
                call.on('stream', userStream => addVideo(userStream));
            });
        }
    });

    myPeer.on('call', call => {
        call.answer(myStream);
        call.on('stream', userStream => addVideo(userStream));
    });

    function addVideo(stream) {
        const v = document.createElement('video');
        v.srcObject = stream;
        v.addEventListener('loadedmetadata', () => v.play());
        document.getElementById('video-grid').append(v);
    }

    // --- MESSAGING LOGIC ---
    function send() {
        const text = document.getElementById('msgInput').value;
        if(text) {
            socket.emit('sendMessage', { roomCode: currentRoom, message: text, username: myName });
            document.getElementById('msgInput').value = "";
        }
    }

    socket.on('newMessage', (msg) => render(msg));
    socket.on('previousMessages', (msgs) => msgs.forEach(m => render(m)));
    socket.on('systemMessage', (txt) => {
        const d = document.createElement('div'); d.className = 'system-msg'; d.innerText = txt;
        document.getElementById('messages').appendChild(d);
    });

    function render(msg) {
        const d = document.createElement('div');
        const isMe = msg.username === myName;
        d.className = `msg ${isMe ? 'my-msg' : 'others-msg'}`;
        const content = msg.content || msg.message;
        d.innerHTML = `<span class="user-label">${isMe ? 'You' : msg.username}</span>${content}`;
        document.getElementById('messages').appendChild(d);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
</script>
</body>
</html>
