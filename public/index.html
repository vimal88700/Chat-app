<!DOCTYPE html>
<html>
<head>
    <title>Chat Safe Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; }
        #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: white; }
        #chat-area { display: none; flex-direction: column; height: 100vh; background: white; }
        input { padding: 12px; margin: 10px; width: 80%; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 12px 50px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; }
        #header { background: #075e54; color: white; padding: 15px; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; }
        .msg { background: white; padding: 8px; margin: 5px; border-radius: 8px; max-width: 80%; }
        #input-area { padding: 10px; display: flex; background: #eee; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="setup">
    <h2>Secure Chat</h2>
    <input type="text" id="code" placeholder="6-Digit Code" maxlength="6">
    <input type="text" id="name" placeholder="Nickname">
    <button id="enterBtn" onclick="startApp()">ENTER</button>
</div>

<!-- CHAT SCREEN -->
<div id="chat-area">
    <div id="header">Room: <span id="roomName"></span></div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msgInput" placeholder="Type here...">
        <button onclick="sendMsg()">Send</button>
    </div>
</div>

<script>
    // 1. Immediate check if script is running
    console.log("Script loaded");

    const socket = io();
    let myPeer;
    try {
        myPeer = new Peer();
    } catch(e) {
        alert("PeerJS failed, calling will be disabled but chat will work.");
    }

    let currentRoom, myName;

    function startApp() {
        // ALERT 1: Check if button click works
        console.log("Button clicked");
        
        const codeInput = document.getElementById('code').value;
        const nameInput = document.getElementById('name').value;

        if (codeInput.length !== 6) {
            alert("Code must be 6 digits!");
            return;
        }
        if (nameInput.trim() === "") {
            alert("Enter a nickname!");
            return;
        }

        // SET DATA
        currentRoom = codeInput;
        myName = nameInput;

        // ALERT 2: Check if we reached the UI switch
        try {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('roomName').innerText = currentRoom;
            
            // Connect to server
            socket.emit('joinRoom', { roomCode: currentRoom, username: myName });
            console.log("Joined room: " + currentRoom);
        } catch(err) {
            alert("Error switching to chat: " + err.message);
        }
    }

    function sendMsg() {
        const text = document.getElementById('msgInput').value;
        if(text.trim()) {
            socket.emit('sendMessage', { roomCode: currentRoom, message: text, username: myName });
            document.getElementById('msgInput').value = "";
        }
    }

    socket.on('newMessage', (msg) => render(msg));
    socket.on('previousMessages', (msgs) => msgs.forEach(render));
    socket.on('systemMessage', (txt) => {
        const d = document.createElement('div');
        d.style.textAlign = "center";
        d.style.fontSize = "10px";
        d.innerText = txt;
        document.getElementById('messages').appendChild(d);
    });

    function render(msg) {
        const d = document.createElement('div');
        const isMe = msg.username === myName;
        d.className = 'msg';
        if(isMe) d.style.alignSelf = "flex-end";
        const content = msg.content || msg.message;
        d.innerHTML = `<b>${msg.username}:</b> ${content}`;
        document.getElementById('messages').appendChild(d);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
</script>
</body>
</html>
