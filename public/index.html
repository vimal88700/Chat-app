<!DOCTYPE html>
<html>
<head>
    <title>Pro Chat & Call</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #e5ddd5; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #debug-log { font-size: 10px; color: #777; padding: 5px; background: #fff; border-bottom: 1px solid #ddd; }
        #setup { background: white; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #setup input { width: 80%; padding: 15px; margin: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        #setup button { width: 85%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; }
        #chat-area { display: none; flex-direction: column; height: 100vh; background: white; }
        #header { background: #075e54; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        #video-panel { display: none; background: #000; height: 280px; position: relative; }
        #video-grid { display: grid; grid-template-columns: 1fr 1fr; height: 100%; gap: 2px; }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; transform: scaleX(-1); }
        #messages { flex: 1; overflow-y: auto; padding: 15px; background: #efe7dd; display: flex; flex-direction: column; }
        .msg { background: white; padding: 10px; margin-bottom: 8px; border-radius: 8px; max-width: 80%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-msg { align-self: flex-end; background: #dcf8c6; }
        #input-area { padding: 10px; display: flex; background: #f0f0f0; border-top: 1px solid #ddd; }
        #msgInput { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; }
        .icon-btn { background: none; border: none; font-size: 24px; color: white; cursor: pointer; margin-left: 15px; }
    </style>
</head>
<body>

    <div id="debug-log">System: Initializing...</div>

    <div id="setup">
        <h2 style="color:#075e54">Secure Chat</h2>
        <input type="text" id="code" placeholder="6-Digit Code" maxlength="6">
        <input type="text" id="name" placeholder="Your Nickname">
        <button onclick="enterChat()">ENTER CHAT</button>
    </div>

    <div id="chat-area">
        <div id="header">
            <b id="roomLabel">Room</b>
            <div id="call-tools">
                <button class="icon-btn" onclick="startCall(false)">📞</button>
                <button class="icon-btn" onclick="startCall(true)">📹</button>
            </div>
        </div>
        <div id="video-panel">
            <div id="video-grid"></div>
            <div style="position:absolute; bottom:15px; width:100%; text-align:center;">
                <button onclick="stopCall()" style="background:#ea4335; color:white; border:none; padding:10px 20px; border-radius:20px; font-weight:bold;">End Call</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="msgInput" placeholder="Type a message...">
            <button onclick="sendMsg()" style="background:#075e54; color:white; border:none; border-radius:50%; width:45px; height:45px; margin-left:5px;">➤</button>
        </div>
    </div>

    <script>
        const socket = io();
        const myPeer = new Peer();
        let myStream, currentRoom, myName, currentCall;

        myPeer.on('open', id => { document.getElementById('debug-log').innerText = "System: Fully Connected"; });

        function enterChat() {
            const c = document.getElementById('code').value;
            const n = document.getElementById('name').value;
            if(c.length === 6 && n !== "") {
                currentRoom = c; myName = n;
                document.getElementById('setup').style.display = 'none';
                document.getElementById('chat-area').style.display = 'flex';
                document.getElementById('roomLabel').innerText = "Room: " + c;
                socket.emit('joinRoom', { roomCode: c, username: n });
            } else { alert("Enter 6 digits and a name"); }
        }

        // --- CALLING LOGIC ---
        async function startCall(video) {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
                document.getElementById('video-panel').style.display = 'block';
                addVid(myStream, true);
                // Signal to others to call us
                socket.emit('call-request', { peerId: myPeer.id, video: video, name: myName });
            } catch(e) { alert("Please allow camera/mic access"); }
        }

        // IMPORTANT: Listen for the signal from the other person
        socket.on('incoming-call', (data) => {
            if(confirm("Accept " + (data.video ? "Video" : "Voice") + " call from " + data.name + "?")) {
                navigator.mediaDevices.getUserMedia({ video: data.video, audio: true }).then(s => {
                    myStream = s;
                    document.getElementById('video-panel').style.display = 'block';
                    addVid(s, true);
                    const call = myPeer.call(data.peerId, s);
                    currentCall = call;
                    call.on('stream', remoteStream => addVid(remoteStream, false));
                });
            }
        });

        myPeer.on('call', call => {
            call.answer(myStream);
            currentCall = call;
            call.on('stream', remoteStream => addVid(remoteStream, false));
        });

        function addVid(s, isMe) {
            const grid = document.getElementById('video-grid');
            const v = document.createElement('video');
            v.srcObject = s;
            v.autoplay = true;
            v.playsInline = true;
            grid.append(v);
        }

        function stopCall() {
            if (myStream) myStream.getTracks().forEach(t => t.stop());
            document.getElementById('video-panel').style.display = 'none';
            document.getElementById('video-grid').innerHTML = '';
        }

        // --- MESSAGING ---
        function sendMsg() {
            const val = document.getElementById('msgInput').value;
            if(val) {
                socket.emit('sendMessage', { roomCode: currentRoom, message: val, username: myName });
                document.getElementById('msgInput').value = "";
            }
        }

        socket.on('newMessage', m => render(m));
        socket.on('previousMessages', arr => {
            document.getElementById('messages').innerHTML = '';
            arr.forEach(render);
        });
        
        socket.on('systemMessage', t => {
            const d = document.createElement('div');
            d.className = 'system-msg';
            d.innerText = t;
            document.getElementById('messages').appendChild(d);
        });

        function render(m) {
            const d = document.createElement('div');
            const isMe = m.username === myName;
            d.className = 'msg ' + (isMe ? 'my-msg' : '');
            // This line fixes the storage display issue
            const txt = m.content || m.message;
            d.innerHTML = `<small style="display:block;color:#075e54;font-weight:bold">${isMe ? 'You' : m.username}</small>${txt}`;
            document.getElementById('messages').appendChild(d);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    </script>
</body>
</html>
